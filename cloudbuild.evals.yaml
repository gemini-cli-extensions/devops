substitutions:
  _RENTAL_PROJECT_ID: ""

serviceAccount: projects/cicd-evals-shared/serviceAccounts/eval-runner@cicd-evals-shared.iam.gserviceaccount.com

steps:
  - name: 'us-central1-docker.pkg.dev/cicd-evals-shared/images/eval-builder:latest'
    env:
      - 'BUILD_ID=$BUILD_ID'
      - 'REGION=us-central1'
      - 'ARTIFACT_REGISTRY=cicd-test'
      - 'RENTAL_PROJECT_ID=${_RENTAL_PROJECT_ID}'
    secretEnv: ['GEMINI_API_KEY']
    script: |
      #!/bin/bash
      set -e
      BUCKET="cicd-eval-project-rentals"
      
      cleanup() {
        if [ -z "$RENTAL_PROJECT_ID" ]; then
          echo "Cleanup: Requesting project release..."
          gcloud storage cp /dev/null gs://$BUCKET/requests/$BUILD_ID/release
        else
          echo "Cleanup: Skipping release as project was pre-assigned."
        fi
      }
      trap cleanup EXIT
      
      if [ -n "$RENTAL_PROJECT_ID" ]; then
        echo "Using provided rental project: $RENTAL_PROJECT_ID"
        PROJECT_ID="$RENTAL_PROJECT_ID"
      else
        echo "Requesting project rental..."
        gcloud storage cp /dev/null gs://$BUCKET/requests/$BUILD_ID/rent
        
        echo "Waiting for project ID..."
        PROJECT_ID=""
        for i in {1..60}; do
          echo "Polling for project ID (attempt $i/60)..."
          if gcloud storage cat gs://$BUCKET/requests/$BUILD_ID/project_id > project_id.txt 2>/dev/null; then
            PROJECT_ID=$(cat project_id.txt)
            echo "Rented project: $PROJECT_ID"
            break
          fi
          sleep 5
        done
        
        if [ -z "$PROJECT_ID" ]; then
          echo "Failed to rent project in time."
          exit 1
        fi
      fi
      
      export PROJECT_ID=$PROJECT_ID
      
      ./run_ci_evals.sh gs://cicd-eval-results/ci/$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

availableSecrets:
  secretManager:
    - versionName: projects/cicd-evals-shared/secrets/gemini-api-key/versions/1
      env: 'GEMINI_API_KEY'
