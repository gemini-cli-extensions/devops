version: "1"

# See https://github.com/mgechev/skillgrade

# Running evals:
# - Create local .env file by filling in values from .env.example
# - Build the base docker image
#  - docker build -t cicd-evals:latest .
# - Install skillgrade: npm i -g @kmonty/skillgrade@latest
# - Run all evals:
#   - GEMINI_API_KEY=<key> skillgrade
# - Run specific evals:
#   - GEMINI_API_KEY=<key> skillgrade --name=task1,task2
# - View results:
#   - skillgrade preview browser


defaults:
  agent: gemini
  provider: docker
  trials: 1 # TODO increase trials
  timeout: 300
  threshold: 0.8 # For --ci mode
  grader_model: gemini-3-flash-preview # default LLM grader model
  docker:
    base: cicd-evals:latest

tasks:

  # Evals for simple static site: https://github.com/sdlc-graph/tinyjam.git
  - name: deploy-static-site-gcs
    instruction: |
      Deploy this static site in ./example to a Google Cloud Storage bucket in region 'us-central1'. 
      The site should be built by using tinyjam itself.

      The bucket name will be available as an environment variable $GCS_BUCKET.
      The project id will be available as an environment variable $PROJECT_ID.

    timeout: 600

    trialConfig:
      setup: git clone https://github.com/sdlc-graph/tinyjam.git
      cleanup: graders/teardown-gcs.sh

    graders:
      - type: deterministic
        run: graders/validate-gcs-deployment.sh
        weight: 1.0

  - name: design-cloud-run-pipeline-python
    instruction: |
      Design a CI/CD pipeline to deploy this application using Terraform. This should include steps
      to lint, build, test and finally deploy to Cloud Run.
      
    trialConfig:
      setup: |
        git clone https://github.com/sdlc-graph/chefs-companion.git && \
        rm chefs-companion/Dockerfile chefs-companion/cloudbuild.yaml
      cleanup: graders/teardown-cloud-run.sh

    graders:
      - type: deterministic
        run: graders/validate-pipeline.sh
        weight: 0.7
      - type: llm_rubric
        rubric: graders/validate-rubric.md
        weight: 0.3

  - name: design-cloud-run-pipeline-nodejs
    instruction: |
      Design a CI/CD pipeline to deploy this application using Terraform. This should include steps
      to lint, build, test and finally deploy to Cloud Run. 

    trialConfig:
      setup: |
        git clone https://github.com/sdlc-graph/chefs-companion.git && \
        rm chefs-companion/Dockerfile chefs-companion/cloudbuild.yaml
      cleanup: graders/teardown-cloud-run.sh

    graders:
      - type: deterministic
        run: graders/validate-pipeline.sh
        weight: 0.7
      - type: llm_rubric
        rubric: graders/validate-rubric.md
        weight: 0.3