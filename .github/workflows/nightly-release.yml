name: Nightly Release

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-mcp-server
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64

    steps:
      - uses: actions/checkout@v3

      - name: prep-release
        run: |
          mkdir -p release
          cp ../gemini-extension.json release/
          cp ../README.md release/
          cp ../local-rag/devops-rag.db release/
          git tag -fa nightly
          git push origin --tags

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.24'
      
      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Fmt
        run: go fmt ./...

      # - name: Run Go Tests
      #   run: go test ./...

      # - name: Install golangci-lint
      #   run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      # - name: Run golangci-lint
      #   run: golangci-lint run

      - name: Build
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          go build -o "release/devops-mcp-server-${GOOS}-${GOARCH}"

      - name: Create release assets
        run: |
          tar -czvf "release/devops-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" -C release "devops-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly
          files: release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
