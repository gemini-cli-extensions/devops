steps:
- name: 'golang:1.24'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.55.2
    go mod tidy
    golangci-lint run ./...
    go build ./...
    go test ./...
  dir: 'devops-mcp-server'
options:
  logging: CLOUD_LOGGING_ONLY